name: HireFlow CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: bash ./mvnw test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hireflow_ci
          POSTGRES_USER: hireflow_ci
          POSTGRES_PASSWORD: hireflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HIREFLOW_POSTGRES_TEST: 'true'
      HIREFLOW_DB_URL: jdbc:postgresql://localhost:5432/hireflow_ci
      HIREFLOW_DB_USERNAME: hireflow_ci
      HIREFLOW_DB_PASSWORD: hireflow_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: bash ./mvnw -Dtest=PostgresMigrationIntegrationTests test
