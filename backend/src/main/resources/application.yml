spring:
  application:
    name: hireflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${HIREFLOW_DB_URL:jdbc:postgresql://localhost:5432/hireflow}
    username: ${HIREFLOW_DB_USERNAME:hireflow}
    password: ${HIREFLOW_DB_PASSWORD:hireflow_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_FILE_SIZE:5MB}
      max-request-size: ${RESUME_MAX_REQUEST_SIZE:6MB}

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo-accounts:
    enabled: ${APP_DEMO_ACCOUNTS_ENABLED:true}
  candidate-portal:
    token-ttl-days: ${CANDIDATE_PORTAL_TOKEN_TTL_DAYS:30}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  google-calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/integrations/google-calendar/callback}
    token-encryption-key: ${GOOGLE_CALENDAR_TOKEN_KEY:}
  storage:
    resume-directory: ${RESUME_STORAGE_DIR:./data/resumes}
    resume-max-bytes: ${RESUME_MAX_BYTES:5242880}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

